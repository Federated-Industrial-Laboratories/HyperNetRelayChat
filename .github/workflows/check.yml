name: Rust checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Install Linux interface dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential tcl pkg-config openssl libssl-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Build controlled SQLCipher
        run: bash Tools/Native.sh
      - name: Check the HRC crate
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        run: bash Tools/Check.sh
      - name: Check maintained Python tools and native helpers
        run: python3 -m compileall -q Tools Tests/Integration
