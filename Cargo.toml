[package]
name = "hypernet-relay-chat"
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0"

[lib]
name = "hrc"
path = "Source/Lib.rs"

[[bin]]
name = "hrc"
path = "Source/Main.rs"

[[example]]
name = "native-local-client"
path = "Tests/Integration/NativeLocalClient.rs"

[[example]]
name = "native-confidential-client"
path = "Tests/Integration/NativeConfidential.rs"

[[example]]
name = "native-federation-client"
path = "Tests/Integration/NativeFederation.rs"

[[example]]
name = "native-load-client"
path = "Tests/Integration/NativeLoad.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2.190"
sha2 = "0.10.9"
getrandom = "0.3.4"
hex = "0.4.3"
thiserror = "2.0.21"
coset = "=0.4.2"
ciborium = "=0.2.2"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
rusqlite = { version = "=0.37.0", features = ["sqlcipher", "hooks", "backup"] }
zeroize = "1.8"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
icu_normalizer = "=2.3.0"
icu_casemap = "=2.3.0"
writeable = "=0.6.4"
openmls = "=0.9.1"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
tls_codec = { version = "=0.5.0", features = ["derive", "std"] }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "glow", "wayland", "x11"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
signal-hook = "=0.3.18"
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }
