[package]
name = "hypernet-relay-chat"
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
name = "hrc"
path = "Source/Lib.rs"

[[bin]]
name = "hrc"
path = "Source/Main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2.190"
sha2 = "0.10.9"
getrandom = "0.3.4"
hex = "0.4.3"
thiserror = "2.0.21"
